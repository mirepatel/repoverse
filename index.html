<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Repoverse turns public GitHub profiles into interactive 3D universes of repositories. Explore repositories, languages, stars, and projects spatially."
    />

    <meta
      name="application-name"
      content="Repoverse"
    />

    <meta
      name="theme-color"
      content="#030305"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <link
      rel="preconnect"
      href="https://api.github.com"
    />

    <title>Repoverse | GitHub in 3D</title>

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Repoverse | GitHub in 3D"
    />

    <meta
      property="og:description"
      content="Explore public GitHub repositories as an interactive 3D universe."
    />

    <meta
      property="og:site_name"
      content="Repoverse"
    />

    <!-- Twitter / social sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Repoverse | GitHub in 3D"
    />

    <meta
      name="twitter:description"
      content="Explore public GitHub repositories as an interactive 3D universe."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
