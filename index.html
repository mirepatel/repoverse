<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Repoverse turns any public GitHub profile into an interactive 3D universe of repositories."
    />

    <meta
      name="application-name"
      content="Repoverse"
    />

    <meta
      name="theme-color"
      content="#030305"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <title>Repoverse | GitHub in 3D</title>

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Repoverse | GitHub in 3D"
    />

    <meta
      property="og:description"
      content="Explore GitHub repositories as an interactive 3D universe."
    />

    <meta
      property="og:site_name"
      content="Repoverse"
    />

    <!-- Twitter / social sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Repoverse | GitHub in 3D"
    />

    <meta
      name="twitter:description"
      content="Explore GitHub repositories as an interactive 3D universe."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
